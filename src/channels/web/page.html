<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge Chat</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#20252c;background:#f5f6f8}body{max-width:900px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:16px}h1{font-size:22px;margin:0}header span{flex:1;color:#69717c;font-size:14px}button{border:1px solid #ccd1d8;border-radius:8px;background:white;padding:9px 16px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:default}.engine{display:flex;align-items:center;gap:7px;font-size:13px;color:#69717c}.engine select{border:1px solid #ccd1d8;border-radius:8px;background:white;padding:8px;font:inherit;color:#20252c}.engine select:disabled{opacity:.5}main{min-height:45vh;margin:28px 0}article{background:white;border:1px solid #e0e3e8;border-radius:12px;padding:18px;margin:14px 0}article.user{background:#eaf0fa}article strong{font-size:13px;color:#626c7b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:8px 0 0}textarea{width:100%;box-sizing:border-box;min-height:110px;padding:14px;border:1px solid #ccd1d8;border-radius:10px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;margin-top:10px}.actions span{flex:1;font-size:13px;color:#69717c}.primary{background:#2457d6;color:white;border-color:#2457d6}#error{color:#b42d39}details{font-size:14px;color:#69717c}footer{font-size:12px;color:#69717c;margin-top:18px}
</style></head>
<body><header><h1>Bridge Chat</h1><span id="status">就绪</span><label class="engine">引擎 <select id="engine" aria-label="执行引擎"></select></label><button id="new">新对话</button></header>
<main id="messages" aria-live="polite"></main><p id="error" role="alert"></p>
<form id="form"><textarea id="prompt" aria-label="消息" placeholder="描述你想完成的任务…" required></textarea><div class="actions"><span>运行中可补充消息。Ctrl / ⌘ + Enter 发送。</span><button type="button" id="stop" disabled>停止</button><button class="primary" id="send">发送</button></div></form>
<footer>此页面连接本机的 agent。关闭运行中的页面会取消当前任务；重新打开后可以继续同一对话。</footer>
<script>
const $=id=>document.getElementById(id);
const supplied=new URLSearchParams(location.hash.slice(1)).get('token');
if(supplied){sessionStorage.setItem('bridge-chat-token',supplied);history.replaceState(null,'',location.pathname);}
const token=sessionStorage.getItem('bridge-chat-token')||'';
const key='bridge-chat:'+location.host;
let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null');}catch{}
let conversationId=saved?.id||crypto.randomUUID(), transcript=saved?.messages||[],runId,working=false;
function persist(){localStorage.setItem(key,JSON.stringify({id:conversationId,messages:transcript}));}
function entry(role,text=''){const box=document.createElement('article');box.className=role;const label=document.createElement('strong');label.textContent=role==='user'?'你':'助手';const content=document.createElement('pre');content.textContent=text;box.append(label,content);$('messages').append(box);return content;}
for(const message of transcript)entry(message.role,message.text);
function busy(value){working=value;$('new').disabled=value;$('stop').disabled=!value;$('engine').disabled=value;$('status').textContent=value?'运行中':'就绪';$('send').textContent=value?'补充':'发送';}
async function request(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','x-ui-token':token},body:JSON.stringify(body)});if(!response.ok){const failure=await response.json();throw Error(failure.error||'请求失败');}return response;}
async function getJson(path){const response=await fetch(path,{headers:{'x-ui-token':token}});if(!response.ok){const failure=await response.json();throw Error(failure.error||'请求失败');}return response.json();}
function renderEngine(data){const select=$('engine');if(!select.options.length){for(const option of data.options){const item=document.createElement('option');item.value=option.value;item.textContent=option.label;select.append(item);}}select.value=data.agent;select.dataset.current=data.agent;}
async function refreshEngine(){if(!token)return;try{renderEngine(await getJson('/api/engine?conversationId='+encodeURIComponent(conversationId)));}catch(e){$('error').textContent=e.message;}}
function stateText(state){const parts=state.blocks.filter(b=>b.kind==='text').map(b=>b.content);if(state.finalText&&!parts.includes(state.finalText))parts.push(state.finalText);if(state.errorMsg)parts.push(state.errorMsg);if(state.terminal==='interrupted')parts.push('已停止');if(state.terminal==='idle_timeout')parts.push('等待超时');return parts.join('\n\n');}
$('form').onsubmit=async event=>{event.preventDefault();$('error').textContent='';const text=$('prompt').value.trim();if(!text)return;
  if(working){try{if(!runId)throw Error('任务正在启动，请稍后补充');const receipt=await(await request('/api/input',{conversationId,runId,text,messageId:crypto.randomUUID()})).json();if(receipt.status!=='accepted')throw Error(receipt.status==='unsupported'?'当前 agent 不支持运行中补充，请等待完成。':receipt.status==='unknown'?'补充消息是否收到尚未确认，请勿重复发送。':'当前任务已结束，请稍后重试');transcript.push({role:'user',text});entry('user',text);$('prompt').value='';persist();}catch(e){$('error').textContent=e.message;}return;}
  busy(true);runId=undefined;$('prompt').value='';transcript.push({role:'user',text});entry('user',text);const reply={role:'assistant',text:''};transcript.push(reply);const display=entry('assistant');const tools=document.createElement('details');const summary=document.createElement('summary');summary.textContent='工具进度';const progress=document.createElement('pre');tools.append(summary,progress);display.parentNode.append(tools);tools.hidden=true;persist();
  try{const response=await request('/api/chat',{conversationId,text});const reader=response.body.getReader(),decoder=new TextDecoder();let pending='';for(;;){const {done,value}=await reader.read();pending+=decoder.decode(value,{stream:!done});const lines=pending.split('\n');pending=lines.pop();for(const line of lines){if(!line)continue;const update=JSON.parse(line);if(update.type==='run.started')runId=update.runId;if(update.type==='run.state'){reply.text=stateText(update.state);display.textContent=reply.text;const calls=update.state.blocks.filter(b=>b.kind==='tool');tools.hidden=!calls.length;progress.textContent=calls.map(b=>b.tool.name+' · '+b.tool.status).join('\n');$('status').textContent=update.state.terminal==='running'?'运行中':update.state.terminal;persist();}if(update.type==='run.failed')throw Error(update.error);}if(done)break;}}
  catch(e){$('error').textContent=e.message;}finally{busy(false);runId=undefined;persist();}};
$('stop').onclick=async()=>{try{if(!runId)return;await request('/api/stop',{conversationId,runId});}catch(e){$('error').textContent=e.message;}};
$('new').onclick=()=>{conversationId=crypto.randomUUID();transcript=[];$('messages').replaceChildren();$('error').textContent='';persist();void refreshEngine();};
$('engine').onchange=async event=>{const select=event.currentTarget;const wanted=select.value;select.disabled=true;try{const result=await(await request('/api/engine',{conversationId,agent:wanted})).json();renderEngine({...result,options:[]});}catch(e){select.value=select.dataset.current||wanted;$('error').textContent=e.message;}finally{select.disabled=working;}};
$('prompt').onkeydown=event=>{if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();$('form').requestSubmit();}};
if(!token)$('error').textContent='请通过启动命令输出的链接打开此页面。';
void refreshEngine();
</script></body></html>
