<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话助理</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f6f7f9;color:#202734;max-width:720px;margin:0 auto;padding:24px}button{font:inherit;border:0;border-radius:8px;padding:10px 16px;margin:4px;background:#e6ebf2;color:#202734;cursor:pointer}button.primary{background:#2865df;color:white}button:disabled{opacity:.5;cursor:wait}article{background:white;border-radius:12px;padding:18px;margin:16px 0;overflow-wrap:anywhere}.muted{color:#65718a;font-size:14px}pre{white-space:pre-wrap;font:inherit}#status{min-height:28px}</style>
<h1>会话助理</h1><p>选一个人或群，自动整理近期消息，分析和建议回复发到你指定的群话题。</p>
<button class="primary" id="choose" disabled>选择会话，交给 AI 处理</button><p id="status">正在连接飞书…</p><main id="jobs"></main>
<script src="https://s3.bytecdn.cn/ee/lark/js_sdk/h5-js-sdk-1.4.13.js"></script>
<script>
let token='', busy=false; const button=document.getElementById('choose'), status=document.getElementById('status');
async function api(path,body={}) { const response=await fetch('./api/'+path,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}); const d=await response.json();if(!response.ok)throw new Error(d.error||'请求失败');return d; }
const native=(name,args={})=>new Promise((resolve,reject)=>window.tt[name]({...args,success:resolve,fail:()=>reject(new Error('飞书操作未完成，请重试'))}));
async function processChat(chatId) { if(busy)return;busy=true;button.disabled=true;status.textContent='正在读取近期消息…';try{await api('process',{chatId});status.textContent='已提交。分析结果将发到指定群话题。';await refresh();}catch(e){status.textContent=e.message;}finally{busy=false;button.disabled=false;} }
button.onclick=async()=>{try{const r=await native('chooseChat',{allowCreateGroup:false,multiSelect:false,selectType:0,confirmTitle:'处理这个会话',confirmText:'交给 AI 处理',showMessageInput:false});if(r.data&&r.data[0])await processChat(r.data[0].id);}catch(e){status.textContent=e.message;}};
async function refresh(){const d=await api('jobs');const root=document.getElementById('jobs');root.replaceChildren();const states={notifying:'待提醒',waiting:'等待决定',queued:'等待分析',running:'正在分析',ready:'等待投递',done:'已发到群话题',claimed:'你已接手',ignored:'已忽略',failed:'分析失败'};for(const j of d.jobs){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=j.source.name+' · '+states[j.state];a.append(h);const meta=document.createElement('p');meta.className='muted';meta.textContent=j.source.chatId;a.append(meta);if(j.error){const p=document.createElement('p');p.textContent=j.error;a.append(p);}if(!['done','ignored','claimed'].includes(j.state))for(const [action,label] of [['process','立即处理'],['claim','我来处理'],['ignore','忽略']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await api('decide',{id:j.id,action});await refresh();}catch(e){status.textContent=e.message;b.disabled=false;}};a.append(b);}root.append(a);}if(d.error)status.textContent=d.error;}
(async()=>{try{if(!window.h5sdk)throw new Error('请在飞书客户端中打开助理');const config=await api('sdk',{url:location.href.split('#')[0]});await new Promise((resolve,reject)=>window.h5sdk.config({...config,onSuccess:resolve,onFail:()=>reject(new Error('飞书网页鉴权失败，请检查可信域名配置'))}));await new Promise(resolve=>window.h5sdk.ready(resolve));const login=await native('requestAccess',{scopeList:[],appID:config.appId,state:config.state});token=(await api('login',{code:login.code,state:config.state})).token;button.disabled=false;status.textContent='选择会话后，无需再挑选或转发消息。';await refresh();setInterval(()=>refresh().catch(e=>{status.textContent=e.message;}),10000);const params=new URLSearchParams(location.search);let launch={};try{launch=JSON.parse(params.get('bdp_launch_query')||'{}');}catch{}const trigger=params.get('triggerCode')||launch.triggerCode;if(trigger){const current=await native('getTriggerContext',{triggerCode:trigger});if(current.openChatId)await processChat(current.openChatId);}}catch(e){status.textContent=e.message;}})();
</script></html>
