name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # Lets the coverage step comment on pull requests.
  pull-requests: write

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22]
        # better-sqlite3 ships no Node 20 prebuilds, so Node 20 compiles it
        # from source; keep it on Linux only to cover the engines range.
        include:
          - os: ubuntu-latest
            node: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # better-sqlite3 compiles from source when its prebuilt binary download
      # times out.  The node-gyp bundled with pnpm 10 (11.x) cannot identify
      # the runner's Visual Studio 2026; 12.1+ can.
      - name: Use a node-gyp that supports Visual Studio 2026
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install -g node-gyp@12
          "npm_config_node_gyp=$(npm root -g)\node-gyp\bin\node-gyp.js" >> $env:GITHUB_ENV

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dead code
        run: pnpm lint:dead

      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 22) }}
        run: pnpm test

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test:coverage

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22 && always()
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build packages
        run: pnpm build:packages
