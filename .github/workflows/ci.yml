name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  # Lets the coverage step comment on pull requests.
  pull-requests: write

jobs:
  test:
    name: Node 20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dead code
        run: pnpm lint:dead

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest' && always()
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
