version = 3

[defaults.run]
max_concurrent_runs = 4
idle_timeout_minutes = 0

[agents.codex.launch]
binaryPath = "codex"
transport = "app-server"
inheritCodexHome = true

[agents.codex.run]
model = { source = "native" }
effort = { source = "native" }

[channels.web]
show_tools = true
show_reasoning = false
