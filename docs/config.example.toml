version = 3

[bridge]
active_profile = "codex"
# monitors_file = "monitors.toml" # Keep the existing monitor file if configured.

# Read only by `up` / `down` (see deploy.md); every key is optional.
# [deploy]
# git = "https://github.com/KuribohG/lark-coding-agent-bridge.git"
# ref = "dev"
# profiles = ["codex"]
# env = { HTTPS_PROXY = "http://proxy:3128" }

[defaults.run]
max_concurrent_runs = 10
idle_timeout_minutes = 0
workflow_timeout_minutes = 480 # Total workflow deadline; each workflow may request a shorter timeout.
# Keep a Claude conversation's prompt cache warm while it waits on its workflow (off unless an interval is set).
# cache_keepalive_interval_minutes = 50
# cache_keepalive_max_pings = 6
# cache_keepalive_min_context_tokens = 100000

# Bridge-wide per-provider limits on model requests (Pi CLI runs in this phase).
# A permit is held only while the provider answers, so tool execution frees it.
# [gate]
# enabled = true
# fail_open = true
# lease_seconds = 600
# [gate.defaults]
# rpm = 1000
# burst = 100
# concurrency = 100
# [gate.providers.deepseek]
# concurrency = 100

# Bridge-wide agent state; every profile and per-chat engine switch resolves the same way.
[state]
memory = "agent" # One memory per engine; "workspace" keeps Claude's per-cwd memory.
# workspace_root = "~/.lark-channel-workspaces"
# agent_home_root = "~/.lark-channel/agents"
# [state.shared]
# instructions = "~/.claude/CLAUDE.md"
# skills = "~/.claude/skills"

[agents.codex.run]
effort = "high"
# model = "provider/model"
# model = { source = "native" } # Delegate to CLI even if a parent selects a model.

[agents.codex.launch]
binaryPath = "codex"
transport = "app-server" # Default and only supported Codex backend.
appServerMode = "daemon" # Persistent app-server; "per-run" disables new memory generation.
# codexHome = "/absolute/private/codex-home"
# provider = "screening" # Select from model_services; changes require restart.
# [agents.codex.launch.env]
# HTTPS_PROXY = "$HTTPS_PROXY"
# NO_PROXY = "localhost,127.0.0.1"

[agents.claude.run]
effort = "high"

[agents.claude.launch]
binaryPath = "claude"
# configDir = "/absolute/private/claude-config"
# mcpConfig = "/absolute/private/claude-mcp.json"
# env = { HTTPS_PROXY = "$HTTPS_PROXY", NO_PROXY = "localhost,127.0.0.1" }

[agents.pi.launch]
binaryPath = "pi"
# agentDir = "/absolute/private/pi-agent"
# env = { HTTPS_PROXY = "$HTTPS_PROXY", NO_PROXY = "localhost,127.0.0.1" }
# Embed the Pi SDK in one long-lived host (steering, many sessions) instead of
# one CLI process per run. nodePath/sdkPath are derived from the launcher.
# transport = "sdk"
# sdkPath = "/absolute/pi/dist/index.js"
# nodePath = "/absolute/node/bin/node"
# idleTtlMs = 900000
# maxSessions = 256
# sessionPersistence = "file"
# Run the host on another machine over ssh (same absolute paths there).
# remote = "user@worker-node"
# sshOptions = ["-i", "/keys/id_worker"]
# Or rent an isolated unit per workflow member; the provider is an executable
# speaking the workcell protocol (see docs/configuration.md).
# [agents.pi.workcell]
# provider = "/absolute/path/to/workcell-provider"
# image = "registry/image:tag"
# cpu = 4
# memoryGb = 8
# ttlSeconds = 3600

[channels.lark]
reply_mode = "markdown"
show_tools = true
progress = "brief"
# Quiet-window used to merge adjacent messages before starting an agent turn.
message_debounce_ms = 600

[channels.lark.network]
# Shared by Bridge's Lark SDK REST/WebSocket, COT, token and H5 auth requests.
proxy = "env" # Default: HTTP(S)_PROXY / ALL_PROXY. Also accepts "direct" or an HTTP(S) proxy URL.
# no_proxy = "localhost,127.0.0.1,::1,.internal,10.0.0.0/8"
# Reconnect/restart the profile after changing network settings.

[channels.web]
show_tools = true
show_reasoning = false

[channels.slack]
show_tools = false
show_progress = true

[channels.lark.profiles.codex]
progress = "detailed"
# message_debounce_ms = 250
# [channels.lark.profiles.codex.network]
# proxy = "http://proxy.example:3128"
# no_proxy = "" # Clear inherited/environment bypass rules for this profile.

[profiles.codex]
agent = "codex"
mode = "personal"

[profiles.codex.accounts.app]
id = "cli_CODEX_EXAMPLE"
tenant = "feishu"
secret = { source = "env", id = "CODEX_BOT_APP_SECRET" }

[profiles.codex.access]
allowedUsers = []
allowedChats = []
admins = []
requireMentionInGroup = true

# Kernel-level (Landlock) write allowlist for agent runs; off by default.
# `allow_tcp = false` denies every TCP bind/connect. See docs/exec-sandbox.md.
[profiles.codex.exec_sandbox]
enabled = false
require_landlock = false
allow_tcp = true
read_write = []
read_only = []

[profiles.claude]
agent = "claude"
mode = "personal"

[profiles.claude.accounts.app]
id = "cli_CLAUDE_EXAMPLE"
tenant = "feishu"
secret = { source = "env", id = "CLAUDE_BOT_APP_SECRET" }

[profiles.claude.access]
allowedUsers = []
allowedChats = []
admins = []
requireMentionInGroup = true
