version = 3

[bridge]
active_profile = "codex"
# monitors_file = "monitors.toml" # Keep the existing monitor file if configured.

[defaults.run]
max_concurrent_runs = 10
idle_timeout_minutes = 0

[agents.codex.run]
effort = "high"
# model = "provider/model"
# model = { source = "native" } # Delegate to CLI even if a parent selects a model.

[agents.codex.launch]
binaryPath = "codex"
transport = "app-server" # Default and only supported Codex backend.
appServerMode = "daemon" # Persistent app-server; "per-run" disables new memory generation.
# codexHome = "/absolute/private/codex-home"
# [agents.codex.launch.env]
# HTTPS_PROXY = "$HTTPS_PROXY"
# NO_PROXY = "localhost,127.0.0.1"

[agents.claude.run]
effort = "high"

[agents.claude.launch]
binaryPath = "claude"
# configDir = "/absolute/private/claude-config"
# env = { HTTPS_PROXY = "$HTTPS_PROXY", NO_PROXY = "localhost,127.0.0.1" }

[agents.pi.launch]
binaryPath = "pi"
# agentDir = "/absolute/private/pi-agent"
# env = { HTTPS_PROXY = "$HTTPS_PROXY", NO_PROXY = "localhost,127.0.0.1" }

[channels.lark]
reply_mode = "markdown"
show_tools = true
progress = "brief"
# Quiet-window used to merge adjacent messages before starting an agent turn.
message_debounce_ms = 600

[channels.web]
show_tools = true
show_reasoning = false

[channels.slack]
show_tools = false
show_progress = true

[channels.lark.profiles.codex]
progress = "detailed"
# message_debounce_ms = 250

[profiles.codex]
agent = "codex"
mode = "personal"

[profiles.codex.accounts.app]
id = "cli_CODEX_EXAMPLE"
tenant = "feishu"
secret = { source = "env", id = "CODEX_BOT_APP_SECRET" }

[profiles.codex.access]
allowedUsers = []
allowedChats = []
admins = []
requireMentionInGroup = true

[profiles.claude]
agent = "claude"
mode = "personal"

[profiles.claude.accounts.app]
id = "cli_CLAUDE_EXAMPLE"
tenant = "feishu"
secret = { source = "env", id = "CLAUDE_BOT_APP_SECRET" }

[profiles.claude.access]
allowedUsers = []
allowedChats = []
admins = []
requireMentionInGroup = true
