[package]
name = "workspace-fs"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Git workspaces served from the object database: a workspace stores only the files changed in it"
publish = false

[[bin]]
name = "wsfs"
path = "src/main.rs"

[dependencies]
fuser = "0.18"
gix = { version = "0.90", default-features = false, features = ["max-performance", "parallel", "sha1"] }
libc = "0.2"
log = "0.4"
serde_json = "1"
sha1 = "0.11"

[profile.release]
# A handler that panics would leave the others serving with what it held locked. The daemon stops whole
# instead: everything a workspace holds is on disk, and whoever started the daemon starts another.
panic = "abort"
# Function names stay, for a backtrace; the line tables are most of the binary's size.
strip = "debuginfo"
