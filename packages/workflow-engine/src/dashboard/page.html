<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflows</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --raised: #ffffff; --wash: rgba(11,11,11,.045); --wash-2: rgba(11,11,11,.08);
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781; --hair: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,.10); --track: #cde2fb;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --idle: #b9b8b1; --void: #dddcd5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --raised: #222221; --wash: rgba(255,255,255,.06); --wash-2: rgba(255,255,255,.11);
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781; --hair: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --accent: #3987e5; --accent-wash: rgba(57,135,229,.16); --track: #104281; --idle: #5b5a56; --void: #3a3a37;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --raised: #222221; --wash: rgba(255,255,255,.06); --wash-2: rgba(255,255,255,.11);
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781; --hair: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
  --accent: #3987e5; --accent-wash: rgba(57,135,229,.16); --track: #104281; --idle: #5b5a56; --void: #3a3a37;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--plane); color: var(--ink); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; display: grid; grid-template: 44px 1fr / 300px 1fr; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 1px solid var(--ring); border-radius: 6px; padding: 3px 10px; }
button:hover { background: var(--wash); }
button.plain { border: 0; padding: 2px 6px; }
input[type=search], input[type=text], select { background: var(--raised); border: 1px solid var(--ring); border-radius: 6px; padding: 4px 8px; min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 12px; }
.dim { color: var(--ink-2); } .faint { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--hair); }
header.top h1 { font-size: 14px; margin: 0; font-weight: 650; }
header.top .label { color: var(--ink-3); }
header.top .gap { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); max-width: 46vw; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; display: inline-block; }
.dot.run { background: var(--accent); } .dot.good { background: var(--good); } .dot.warn { background: var(--warning); }
.dot.serious { background: var(--serious); } .dot.bad { background: var(--critical); } .dot.mute { background: var(--idle); }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }

aside.side { background: var(--surface); border-right: 1px solid var(--hair); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.side .tools { padding: 8px 10px; display: flex; gap: 6px; border-bottom: 1px solid var(--hair); }
.side .tools input { flex: 1; }
.side .list { overflow: auto; flex: 1; padding: 4px 0 20px; }
.side .group { padding: 10px 14px 4px; color: var(--ink-3); font-size: 11px; letter-spacing: .04em; }
.wf { display: block; padding: 7px 14px 8px; border-left: 3px solid transparent; cursor: pointer; color: inherit; }
.wf:hover { background: var(--wash); text-decoration: none; }
.wf.on { background: var(--accent-wash); border-left-color: var(--accent); }
.wf.child { padding-left: 30px; }
.wf .l1 { display: flex; align-items: center; gap: 7px; }
.wf .name { font-weight: 600; flex: 1; min-width: 0; }
.wf .l2, .wf .l3 { color: var(--ink-2); font-size: 12px; }
.wf .l3 { color: var(--ink-3); }

main { overflow: hidden; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 12px 20px 0; background: var(--surface); border-bottom: 1px solid var(--hair); }
.head .title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 18px; font-weight: 650; }
.head .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 12px; margin-top: 4px; }
.head .goal { margin: 8px 0 0; color: var(--ink-2); max-width: 1100px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px 1px 7px; border-radius: 999px; background: var(--wash); white-space: nowrap; font-size: 12px; }
.chip.btn { cursor: pointer; border: 1px solid transparent; }
.chip.btn:hover { background: var(--wash-2); }
.chip.btn.on { border-color: var(--accent); background: var(--accent-wash); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--wash); font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 0; max-width: 1100px; }
.tile { background: var(--raised); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 12px 9px; min-width: 0; }
.tile .k { color: var(--ink-2); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; line-height: 1.25; }
.tile .v small { font-size: 13px; font-weight: 400; color: var(--ink-3); }
.tile .s { color: var(--ink-3); font-size: 12px; }
.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
.tabs a { padding: 7px 12px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
#content { flex: 1; overflow: auto; padding: 14px 20px 60px; min-height: 0; }
.empty { color: var(--ink-3); padding: 28px 0; text-align: center; }
.error { color: var(--ink); background: var(--raised); border: 1px solid var(--ring); border-left: 3px solid var(--critical); border-radius: 6px; padding: 8px 12px; margin: 0 0 12px; white-space: pre-wrap; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
.bar .spacer { flex: 1; }
.bar label { color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; margin: 0 0 14px; overflow: hidden; }
.card > h3 { margin: 0; padding: 8px 12px; font-size: 13px; font-weight: 650; border-bottom: 1px solid var(--hair); display: flex; gap: 8px; align-items: baseline; }
.card > h3 .more { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.card > .body { padding: 10px 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; align-items: start; }
.cols > .card { margin: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { color: var(--ink-2); font-weight: 500; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
tr:last-child > td { border-bottom: 0; }
tr.row { cursor: pointer; } tr.row:hover > td { background: var(--wash); }
tr.sel > td { background: var(--accent-wash); }
td.wide { max-width: 420px; } td.mid { max-width: 240px; }
.tablewrap { overflow: auto; }
.seg { display: flex; gap: 2px; height: 8px; min-width: 90px; }
.seg i { display: block; height: 100%; min-width: 3px; border-radius: 2px; }
.seg i:first-child { border-radius: 4px 2px 2px 4px; } .seg i:last-child { border-radius: 2px 4px 4px 2px; } .seg i:only-child { border-radius: 4px; }
.seg .pending { background: var(--idle); } .seg .claimed { background: var(--accent); } .seg .completed { background: var(--good); }
.seg .failed { background: var(--critical); } .seg .cancelled { background: var(--void); } .seg .none { background: var(--wash-2); flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.meter { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 5px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.over i { background: var(--critical); }
pre, .pre { white-space: pre-wrap; word-break: break-word; margin: 0; font: 12px/1.55 var(--mono); }
.prose { white-space: pre-wrap; word-break: break-word; }
.fold { max-height: 9.2em; overflow: hidden; position: relative; }
.fold.tall { max-height: 21em; }
.fold::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.4em; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
.post { padding: 10px 12px; border-bottom: 1px solid var(--hair); }
.post:last-child { border-bottom: 0; }
.post.done { opacity: .72; }
.post .hd { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-bottom: 3px; }
.post .hd b { font-weight: 650; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; min-width: 0; word-break: break-word; }

#drawer { position: fixed; top: 44px; right: 0; bottom: 0; width: min(900px, 62vw); background: var(--surface); border-left: 1px solid var(--hair); box-shadow: -8px 0 24px rgba(0,0,0,.12); display: none; flex-direction: column; z-index: 5; }
#drawer.open { display: flex; }
#drawer .dh { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--hair); }
#drawer .dh h3 { margin: 0; font-size: 14px; flex: 1; min-width: 0; }
#drawer .db { overflow: auto; padding: 12px 14px 60px; flex: 1; }
#drawer section { margin: 0 0 16px; }
#drawer section > h4 { margin: 0 0 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
#drawer .box { border: 1px solid var(--ring); border-radius: 6px; padding: 8px 10px; background: var(--raised); }
@media (max-width: 900px) { body { grid-template-columns: 0 1fr; } aside.side { display: none; } #drawer { width: 100vw; } }
</style>
</head>
<body>
<header class="top">
  <h1>Workflows</h1><span class="label" id="label"></span>
  <select id="source" title="工作流存储" hidden></select>
  <span class="gap"></span>
  <span class="live" id="live"><span class="dot"></span><span class="clip" id="liveText">连接中…</span></span>
  <button id="pause" title="暂停或恢复自动刷新">暂停</button>
  <button id="theme" title="切换浅色/深色">主题</button>
</header>
<aside class="side">
  <div class="tools"><input type="search" id="wfFilter" placeholder="筛选工作流（名称、需求、ID）"></div>
  <div class="list" id="list"></div>
</aside>
<main>
  <div class="head" id="head" hidden></div>
  <div id="content"><div class="empty">选择左侧的工作流查看详情。</div></div>
</main>
<div id="drawer"><div class="dh"><button class="plain" id="drawerBack" title="返回上一项">←</button><h3 class="clip" id="drawerTitle"></h3><button class="plain" id="drawerClose" title="关闭（Esc）">✕</button></div><div class="db" id="drawerBody"></div></div>
<script>

        h('div', { class: 'hd' }, h('b', {}, message.from), message.post ? h('span', { class: 'tag' }, '帖 #' + message.post) : null, message.topic ? h('span', { class: 'tag' }, '#' + message.topic) : null, h('span', { class: 'faint' }, tick('ago', message.at))),
        folded('msg:' + message.id, message.text)))) : h('div', { class: 'faint' }, '没有未读消息。')),
      section('最近轮次', `最近 ${d.recentTurns.length} 轮（仍在状态里的）`, turnList(d.recentTurns)),
      section('认领记录', `最近 ${d.claims.length} 次`, d.claims.length ? h('div', { class: 'box', style: 'padding:0' }, table('dclaims', [
        { title: '工作项', cell: c => h('span', { class: 'mono' }, c.item) }, { title: '标题', cls: 'wide', cell: c => h('div', { class: 'clip', title: c.title }, c.title) }, { title: '结果', cell: c => CLAIM[c.status] || c.status },
        { title: '认领于', cls: 'nowrap', cell: c => tick('ago', c.createdAt) }, { title: '原因', cls: 'mid', cell: c => c.reason ? h('div', { class: 'clip', title: c.reason }, c.reason) : '' }], d.claims, { onRow: c => openDrawer('item', c.item) }))
        : h('div', { class: 'faint' }, '没有认领过工作项。')),
      d.checkpointState ? section('恢复点内容', null, h('div', { class: 'box' }, folded('cp:' + d.name, d.checkpointState, { mono: true }))) : null,
    ];
  } else if (kind === 'item') {
    title = `工作项 ${d.key}`;
    nodes = [
      section('概况', null, h('dl', { class: 'kv box' },
        h('dt', {}, '标题'), h('dd', {}, d.title),
        h('dt', {}, '状态'), h('dd', {}, chip(...pair(ITEM, d.status)), d.hold ? ` · 搁置${d.heldReason ? '：' + d.heldReason : ''}` : '', d.gate ? ' · 条件项' : '', d.archived ? ' · 已归档' : ''),
        h('dt', {}, '队列'), h('dd', {}, `${d.queue} · 优先级 ${d.priority}（越大越先）`),
        h('dt', {}, '负责'), h('dd', {}, d.owner ? h('a', { onclick: () => openDrawer('member', d.owner) }, d.owner) : d.doneBy ? ['完成者 ', h('a', { onclick: () => openDrawer('member', d.doneBy) }, d.doneBy)] : '无人持有', d.assignee ? ` · 指定给 ${d.assignee}` : '', d.by ? ` · 创建者 ${d.by}` : ''),
        h('dt', {}, '认领'), h('dd', {}, `${d.generation} / ${d.maxAttempts} 次` + (d.failures ? ` · 成员自身失败 ${d.failures} 次` : '') + ` · 进展 #${d.progress}` + (d.progressAt ? `（${clock(d.progressAt)}）` : '')),
        d.origin ? [h('dt', {}, '出自'), h('dd', {}, d.origin)] : null,
        d.dependsOn ? [h('dt', {}, '依赖'), h('dd', {}, d.dependsOn.map(key => [h('a', { class: 'mono', onclick: () => openDrawer('item', key) }, key), (d.waitsOn || []).includes(key) ? h('span', { class: 'tag' }, '未完成') : null, ' ']))] : null,
        d.supersedes ? [h('dt', {}, '取代了'), h('dd', { class: 'mono' }, d.supersedes.join(' '))] : null, d.supersededBy ? [h('dt', {}, '被取代'), h('dd', {}, h('a', { class: 'mono', onclick: () => openDrawer('item', d.supersededBy) }, d.supersededBy))] : null,
        d.settledBy ? [h('dt', {}, '裁定者'), h('dd', {}, d.settledBy)] : null,
        d.resources.length ? [h('dt', {}, '资源'), h('dd', { class: 'mono' }, d.resources.join(' '))] : null, d.writes ? [h('dt', {}, '写入'), h('dd', { class: 'mono' }, d.writes.join(' '))] : null,
        h('dt', {}, '时间'), h('dd', {}, `创建 ${clock(d.createdAt)} · 更新 ${clock(d.updatedAt)}`))),
      d.error ? section('失败原因', null, h('div', { class: 'error' }, d.error)) : null,
      section('任务内容', null, h('div', { class: 'box' }, folded('in:' + d.key, d.input, { tall: true }))),
      d.result !== undefined ? section('结果', null, h('div', { class: 'box' }, folded('out:' + d.key, d.result, { tall: true }))) : null,
      d.progressState ? section('保存的进展', `#${d.progress}`, h('div', { class: 'box' }, folded('prog:' + d.key, d.progressState, { mono: true }))) : null,
      section('认领历史', `${d.claims.length} 次（仍在状态里的）`, d.claims.length ? h('div', { class: 'box', style: 'padding:0' }, table('iclaims', [
        { title: '第几次', num: true, cell: c => c.generation }, { title: '成员', cell: c => c.member }, { title: '结果', cell: c => CLAIM[c.status] || c.status },
        { title: '认领于', cls: 'nowrap', cell: c => clock(c.createdAt) }, { title: '历时', cls: 'nowrap', cell: c => c.endedAt ? dur(c.endedAt - c.createdAt) : tick('for', c.createdAt) },
        { title: '原因', cls: 'mid', cell: c => c.reason ? h('div', { class: 'clip', title: c.reason }, c.reason) : '' }], d.claims, { onRow: c => openDrawer('turn', c.taskId) })) : h('div', { class: 'faint' }, '还没有被认领过。')),
    ];
  } else {
    title = `轮次 ${d.member ? d.member + ' · ' : ''}${brief(d.key)}`;
    nodes = [
      section('概况', null, h('dl', { class: 'kv box' },
        h('dt', {}, '状态'), h('dd', {}, chip(...pair(TURN, d.status)), d.archived ? ' · 已归档' : '', d.readOnly ? ' · 只读' : ''),
        h('dt', {}, '成员'), h('dd', {}, d.member ? h('a', { onclick: () => openDrawer('member', d.member) }, d.member) : '一次性 agent 调用'),
        h('dt', {}, '执行'), h('dd', {}, model(d)),
        d.workspace ? [h('dt', {}, '工作树'), h('dd', { class: 'mono' }, d.workspace)] : null,
        d.nativeSessionId ? [h('dt', {}, '原生会话'), h('dd', {}, copyable(d.nativeSessionId))] : null,
        h('dt', {}, 'taskId'), h('dd', {}, copyable(d.taskId)))),
      d.error ? section('错误', null, h('div', { class: 'error' }, d.error)) : null,
      section('尝试', `${d.attemptList.length} 次`, h('div', { class: 'box', style: 'padding:0' }, table('attempts', [
        { title: '排队于', cls: 'nowrap', cell: a => clock(a.startedAt) }, { title: '等槽位', cls: 'nowrap', cell: a => a.admittedAt ? dur(a.admittedAt - a.startedAt) : a.endedAt ? '—' : tick('for', a.startedAt) },
        { title: '执行', cls: 'nowrap', cell: a => a.admittedAt ? (a.endedAt ? dur(a.endedAt - a.admittedAt) : tick('for', a.admittedAt)) : '' },
        { title: '首个会话信号', cls: 'nowrap', cell: a => a.sessionAt && a.admittedAt ? '+' + dur(a.sessionAt - a.admittedAt) : '' },
        { title: '结果', cell: a => [a.result, a.failureKind, a.stopReason].filter(Boolean).join(' · ') || (a.endedAt ? '' : '进行中') }], d.attemptList))),
      d.direct.length ? section('回合内收到的话', `${d.direct.length} 条`, h('div', { class: 'box', style: 'padding:0' }, d.direct.map(message => h('div', { class: 'post' }, h('div', { class: 'hd' }, h('b', {}, message.by || message.from),
        h('span', { class: 'faint' }, clock(message.at), message.delivery ? ' · ' + message.delivery : '')), h('div', { class: 'prose' }, message.text))))) : null,
      d.results.map((result, index) => section(index ? `结果 ${index + 1}` : '结果', `${result.kind} · ${clock(result.createdAt)}` + (result.truncated ? ' · 已截断' : ''), h('div', { class: 'box' }, folded('res:' + result.ref, result.text, { tall: true, limit: 1500 })))),
      section('这一轮收到的提示', `${d.objective.length} 字`, h('div', { class: 'box' }, folded('obj:' + d.taskId, d.objective, { tall: true }))),
    ];
  }
  $('drawerTitle').textContent = title; $('drawerTitle').title = title;
  body.replaceChildren(...nodes.flat(Infinity).filter(Boolean));
  body.scrollTop = top;
  $('drawer').classList.add('open');
}
function closeDrawer() { const { d, ...rest } = S.q; if (d !== undefined) go({ q: rest }); }
$('drawerClose').addEventListener('click', closeDrawer);
$('drawerBack').addEventListener('click', () => history.back());
document.addEventListener('keydown', event => { if (event.key === 'Escape' && S.q.d) closeDrawer(); });

// ---------- chrome ----------
$('label').textContent = LABEL || '';
if (LABEL) document.title = 'Workflows · ' + LABEL;
$('source').addEventListener('change', event => go({ source: event.target.value, wf: null, tab: 'overview', q: {} }));
$('pause').addEventListener('click', () => { S.paused = !S.paused; $('pause').textContent = S.paused ? '继续' : '暂停'; if (!S.paused) refresh(); else live('warn', '已暂停自动刷新'); });
$('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('wf-dashboard-theme', document.documentElement.dataset.theme); } catch { /* storage may be unavailable in an embedded page */ }
});
try { const saved = localStorage.getItem('wf-dashboard-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch { /* as above */ }
Object.assign(S, parseHash());
refresh();
})();
</script>
